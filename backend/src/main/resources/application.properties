spring.application.name=backend

# ===================================================================
# SQLite Veritabanı Yapılandırması (.NET Core ConnectionStrings karşılığı)
# ===================================================================
spring.datasource.url=jdbc:sqlite:kidstory.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# ===================================================================
# JPA / Hibernate Yapılandırması (.NET Core dotnet ef database update / EnsureCreated mantığı)
# ===================================================================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# ddl-auto=update: Uygulama açılışında Entity sınıflarını tarayarak tabloları ve ilişkileri otomatik günceller/oluşturur.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
