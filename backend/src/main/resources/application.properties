spring.application.name=masal-dunyasi
spring.profiles.default=dev

# Gizli anahtarlar çalışma klasöründeki .env dosyasından okunur (git'e girmez; şablon: .env.example).
# Dosya yoksa sorun olmaz; ortam değişkenleri yine geçerlidir ve .env'deki değerleri ezer.
spring.config.import=optional:file:.env[.properties]

# Şema yalnızca Flyway ile yönetilir; Hibernate sadece doğrular.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Hata ayrıntıları istemciye sızdırılmaz.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.refresh-token.days=${REFRESH_TOKEN_DAYS:30}

# Yapay zekâ sağlayıcıları. Anahtar yoksa geliştirmede o rol için taslak kullanılır; üretimde Featherless ve Gemini zorunludur.
# Masal metni: Trendyol LLM, Featherless AI üzerinden (OpenAI uyumlu)
app.ai.featherless.api-key=${FEATHERLESS_API_KEY:}
app.ai.featherless.base-url=${FEATHERLESS_BASE_URL:https://api.featherless.ai/v1}
# Sahnelere bölme: Google Gemini Flash, Interactions API
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.ai.gemini.api-revision=${GEMINI_API_REVISION:2026-05-20}
# Groq: kapalı alternatif (ai_providers_config içinde pasif)
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
# Sahne resimleri: Cloudflare Workers AI (FLUX.2 klein 4B). Anahtar yoksa geliştirmede taslak resim kullanılır.
app.ai.cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
app.ai.cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}
app.ai.cloudflare.base-url=${CLOUDFLARE_BASE_URL:https://api.cloudflare.com/client/v4}
# Resim boyutu (4:3) ve karakter tutarlılığı için referans portre kullanımı
app.image.width=1024
app.image.height=768
app.image.character-references=true
# Seslendirme: Kikiri Türkçe TTS, kendi çalıştırdığımız tts-service üzerinden (ücretsiz model, bkz. tts-service/README.md).
# KIKIRI_TTS_TOKEN servisteki TTS_SERVICE_TOKEN ile aynıdır; KIKIRI_TTS_HF_TOKEN yalnızca özel Hugging Face Space için.
app.ai.kikiri.enabled=${KIKIRI_TTS_ENABLED:true}
app.ai.kikiri.base-url=${KIKIRI_TTS_URL:http://localhost:8000}
app.ai.kikiri.token=${KIKIRI_TTS_TOKEN:}
app.ai.kikiri.hf-token=${KIKIRI_TTS_HF_TOKEN:}

# Masal ses (ve ileride görsel) dosyalarının klasörü
app.media.dir=${MEDIA_DIR:media}

# Arka plan masal üretim işçisi (veritabanı kuyruğu)
app.generation.worker-enabled=true
app.generation.poll-ms=2000

# E-postadaki bağlantıların başlangıcı
app.base-url=${APP_BASE_URL:http://localhost:8080}

# E-posta (SMTP). spring.mail.host boşsa geliştirmede e-posta gönderilmez, bağlantılar log'a yazılır.
# Geliştirmede SMTP bilgileri git'e girmeyen backend/config/application-dev.properties dosyasına yazılır.
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${spring.mail.username:}}

# Giriş güvenliği: hesap başına hatalı deneme kilidi ve IP başına dakikalık istek sınırı
app.security.login-max-failures=5
app.security.login-lock-minutes=15
app.security.ip-requests-per-minute=20

# Kütüphane örnek resimleri (yönetim paneli): resim başına 5 MB, istek başına 4 resim + form ~20 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=21MB
server.tomcat.max-swallow-size=25MB
