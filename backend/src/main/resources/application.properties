spring.application.name=masal-dunyasi
spring.profiles.default=dev

# Şema yalnızca Flyway ile yönetilir; Hibernate sadece doğrular.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Hata ayrıntıları istemciye sızdırılmaz.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.refresh-token.days=${REFRESH_TOKEN_DAYS:30}

# E-postadaki bağlantıların başlangıcı
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Giriş güvenliği: hesap başına hatalı deneme kilidi ve IP başına dakikalık istek sınırı
app.security.login-max-failures=5
app.security.login-lock-minutes=15
app.security.ip-requests-per-minute=20

# Masal üretimi
# E-posta doğrulaması şimdilik kapalı: kayıtta doğrulama e-postası gitmez, masal oluşturmak doğrulama beklemez.
# Açmak için true yapın (veya EMAIL_VERIFICATION_ENABLED=true).
app.account.email-verification.enabled=${EMAIL_VERIFICATION_ENABLED:false}
# Üretilen görsel ve sesler; üretimde kalıcı bir disk veya S3/R2 adaptörü kullanılır.
app.storage.dir=${STORAGE_DIR:.media}
# Üretim kuyruğu işleyicisi
app.jobs.enabled=true
app.jobs.poll-ms=2000