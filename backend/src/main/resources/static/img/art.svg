<svg xmlns="http://www.w3.org/2000/svg">
<!--
  Masal Dünyası vektör çizimleri. Kullanım: <svg><use href="/img/art.svg#pamuk"/></svg>
  Karakterler 200x200, düz renkli (flat vector). Göz kırpma animasyonu bu dosyanın kendi stilindedir.
-->
<style>
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>

<!-- Ortak yüz parçaları -->
<symbol id="eyes" viewBox="0 0 60 24">
