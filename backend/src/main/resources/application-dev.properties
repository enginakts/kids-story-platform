# Yerel geliştirme: docker compose PostgreSQL'i. Docker yoksa README'deki gömülü PostgreSQL komutunu kullanın.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kidstory}
spring.datasource.username=${DB_USER:kidstory}
spring.datasource.password=${DB_PASSWORD:kidstory_dev_pw}
spring.thymeleaf.cache=false

# SADECE geliştirme içindir. Üretimde kullanılmaz.
