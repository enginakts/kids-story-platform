# Üretim: gizli değerlerin varsayılanı yoktur; eksikse uygulama başlamaz.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework
app.jwt.secret=${JWT_SECRET}
app.base-url=${APP_BASE_URL}
app.ai.featherless.api-key=${FEATHERLESS_API_KEY}
app.ai.gemini.api-key=${GEMINI_API_KEY}
app.ai.groq.api-key=${GROQ_API_KEY:}

# SMTP zorunludur; tanımlı değilse uygulama başlamaz.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=${MAIL_FROM}
app.bootstrap.admin.username=${ADMIN_USERNAME:}
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
