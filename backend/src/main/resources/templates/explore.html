<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Keşfet')}"></head>
<body>
<svg th:replace="~{fragments/layout :: icons}"></svg>
<a th:replace="~{fragments/layout :: skip}"></a>
<header th:replace="~{fragments/layout :: publicNav}"></header>
<main id="main">
    <h1>Keşfet</h1>
    <p class="lead">Diğer ailelerin paylaştığı ve ekibimizin onayladığı masallar.</p>
    <div class="empty" th:if="${#lists.isEmpty(stories)}">
        <svg class="icon icon-lg" aria-hidden="true"><use href="#i-compass"/></svg>
        <h2>Henüz yayımlanmış masal yok</h2>
        <p>Herkese açık paylaşılan masallar onaylandıktan sonra burada görünecek.</p>
    </div>
    <ul class="grid" th:unless="${#lists.isEmpty(stories)}" role="list" style="list-style:none;padding:0">
        <li class="card card-interactive" th:each="story : ${stories}"><span class="card-title" th:text="${story.title}">Başlık</span></li>
    </ul>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
