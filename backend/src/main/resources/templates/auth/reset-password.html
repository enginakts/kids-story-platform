<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Yeni parola')}"></head>
<body>
<svg th:replace="~{fragments/layout :: icons}"></svg>
<a th:replace="~{fragments/layout :: skip}"></a>
<header th:replace="~{fragments/layout :: publicNav}"></header>
<main id="main" class="auth-page">
    <section class="book-spread" data-book>
        <div th:replace="~{fragments/layout :: bookPlate('sepet', 'Turuncu pelerinli anne tavşan, kolunda sepetle yürüyüşe çıkıyor')}"></div>
        <div class="book-page book-form">
            <p class="running-head">Bir varmış, bir yokmuş</p>
            <div class="book-copy auth-copy">
                <h1 class="auth-title">Yeni parola belirleyin</h1>
                <th:block th:unless="${usable}">
                    <p class="alert alert-danger" role="alert"><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>Bağlantı geçersiz veya süresi dolmuş.</p>
                    <a class="btn btn-secondary btn-block" th:href="@{/forgot-password}">Yeni bağlantı iste</a>
                </th:block>
                <form th:if="${usable}" th:action="@{/reset-password}" th:object="${form}" method="post" class="form" data-stagger>
                    <input type="hidden" th:field="*{token}">
                    <div class="field">
                        <label for="newPassword">Yeni parola</label>
                        <input id="newPassword" type="password" name="newPassword" minlength="8" maxlength="72" autocomplete="new-password" required aria-describedby="np-hint">
                        <p class="hint" id="np-hint">En az 8 karakter.</p>
                        <p th:replace="~{fragments/forms :: error('newPassword')}"></p>
                    </div>
                    <button class="btn btn-primary btn-block" type="submit">Parolayı değiştir</button>
                </form>
            </div>
            <p class="folio" aria-hidden="true">13</p>
        </div>
    </section>
</main>
</body>
</html>
