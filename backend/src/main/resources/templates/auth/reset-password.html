<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Yeni parola')}"></head>
<body>
<header th:replace="~{fragments/layout :: publicNav}"></header>
<main class="auth">
    <section class="panel">
        <h1>Yeni parola</h1>
        <th:block th:unless="${usable}">
            <p class="alert" role="alert">Bağlantı geçersiz veya süresi dolmuş.</p>
            <p style="margin-top:16px"><a th:href="@{/forgot-password}">Yeni bağlantı iste</a></p>
        </th:block>
        <form th:if="${usable}" th:action="@{/reset-password}" th:object="${form}" method="post" class="form">
            <input type="hidden" th:field="*{token}">
            <label>Yeni parola <input type="password" name="newPassword" minlength="8" maxlength="72" autocomplete="new-password" required></label>
            <p class="error" th:errors="*{newPassword}"></p>
            <button class="button big">Parolayı değiştir</button>
        </form>
    </section>
    <figure>
        <svg class="art cloud" viewBox="0 0 120 60" aria-hidden="true"><use th:href="@{/img/art.svg} + '#cloud'"/></svg><svg class="art" viewBox="0 0 200 200" aria-hidden="true"><use th:href="@{/img/art.svg} + '#fikri'"/></svg>
        <figcaption>Fikri yeni parolanızı unutmaz.</figcaption>
    </figure>
</main>
</body>
</html>
