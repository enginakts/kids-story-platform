<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Giriş yap')}"></head>
<body>
<svg th:replace="~{fragments/layout :: icons}"></svg>
<a th:replace="~{fragments/layout :: skip}"></a>
<header th:replace="~{fragments/layout :: publicNav}"></header>
<main id="main" class="auth">
    <div class="card">
        <h1>Tekrar hoş geldiniz</h1>
        <p class="alert alert-danger" role="alert" th:if="${param.error}"><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>E-posta veya parola hatalı.</p>
        <p class="alert alert-danger" role="alert" th:if="${param.locked}"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>Çok fazla hatalı deneme yapıldı. Lütfen 15 dakika sonra tekrar deneyin.</p>
        <p class="alert alert-info" role="status" th:if="${param.logout}"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>Çıkış yapıldı.</p>
        <p class="alert alert-success" role="status" th:if="${param.reset}"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>Parolanız değiştirildi. Yeni parolanızla giriş yapabilirsiniz.</p>
        <form th:action="@{/login}" method="post" class="form">
            <div class="field"><label for="username">E-posta</label><input id="username" type="email" name="username" autocomplete="email" required></div>
            <div class="field"><label for="password">Parola</label><input id="password" type="password" name="password" autocomplete="current-password" required></div>
            <button class="btn btn-primary btn-block" type="submit">Giriş yap</button>
        </form>
        <p class="auth-foot"><a th:href="@{/forgot-password}">Parolamı unuttum</a> · <a th:href="@{/register}">Hesap oluştur</a></p>
    </div>
</main>
</body>
</html>
