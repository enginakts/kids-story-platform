<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Giriş yap')}"></head>
<body>
<header th:replace="~{fragments/layout :: publicNav}"></header>
<main class="auth">
    <section class="panel">
        <h1>Tekrar hoş geldiniz</h1>
        <p class="lead">Çocuklarınızın kütüphanesine giriş yapın.</p>
        <p class="alert" th:if="${param.error}" role="alert">E-posta veya parola hatalı.</p>
        <p class="alert" th:if="${param.locked}" role="alert">Çok fazla hatalı deneme yapıldı. Lütfen 15 dakika sonra tekrar deneyin.</p>
        <p class="notice" th:if="${param.logout}">Çıkış yapıldı. İyi geceler!</p>
        <p class="notice" th:if="${param.reset}">Parolanız değiştirildi. Yeni parolanızla giriş yapabilirsiniz.</p>
        <form th:action="@{/login}" method="post" class="form">
            <label>E-posta <input type="email" name="username" autocomplete="email" required></label>
            <label>Parola <input type="password" name="password" autocomplete="current-password" required></label>
            <button class="button big">Giriş yap</button>
        </form>
        <p style="margin-top:20px"><a th:href="@{/forgot-password}">Parolamı unuttum</a> · <a th:href="@{/register}">Hesap oluştur</a></p>
    </section>
    <figure>
        <svg class="art cloud" viewBox="0 0 120 60" aria-hidden="true"><use th:href="@{/img/art.svg} + '#cloud'"/></svg><svg class="art" viewBox="0 0 200 200" aria-hidden="true"><use th:href="@{/img/art.svg} + '#pamuk'"/></svg>
        <figcaption>Pamuk, masalın başlamasını bekliyor.</figcaption>
    </figure>
</main>
</body>
</html>
