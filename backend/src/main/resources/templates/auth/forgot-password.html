<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Parolamı unuttum')}"></head>
<body>
<header th:replace="~{fragments/layout :: publicNav}"></header>
<main class="auth">
    <section class="panel">
        <h1>Parolamı unuttum</h1>
        <p class="lead">E-posta adresinizi yazın, size bir sıfırlama bağlantısı gönderelim.</p>
        <p class="notice" th:if="${sent}">Bu adres kayıtlıysa parola sıfırlama bağlantısı gönderildi. Gelen kutunuzu kontrol edin.</p>
        <form th:unless="${sent}" th:action="@{/forgot-password}" th:object="${form}" method="post" class="form">
            <label>E-posta <input type="email" th:field="*{email}" autocomplete="email" required></label>
            <p class="error" th:errors="*{email}"></p>
            <button class="button big">Bağlantı gönder</button>
        </form>
        <p style="margin-top:20px"><a th:href="@{/login}">Girişe dön</a></p>
    </section>
    <figure>
        <svg class="art cloud" viewBox="0 0 120 60" aria-hidden="true"><use th:href="@{/img/art.svg} + '#cloud'"/></svg><svg class="art" viewBox="0 0 200 200" aria-hidden="true"><use th:href="@{/img/art.svg} + '#mavi'"/></svg>
        <figcaption>Mavi sabırla bekler.</figcaption>
    </figure>
</main>
</body>
</html>
