<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Parolamı unuttum')}"></head>
<body>
<svg th:replace="~{fragments/layout :: icons}"></svg>
<a th:replace="~{fragments/layout :: skip}"></a>
<header th:replace="~{fragments/layout :: publicNav}"></header>
<main id="main" class="auth-page">
    <section class="book-spread" data-book>
        <div th:replace="~{fragments/layout :: bookPlate('kapi', 'Beyaz tavşan bir kapının önünde küçük bir fareyle karşılaşıyor')}"></div>
        <div class="book-page book-form">
            <p class="running-head">Bir varmış, bir yokmuş</p>
            <div class="book-copy auth-copy">
                <h1 class="auth-title">Parolamı unuttum</h1>
                <p class="alert alert-success" role="status" th:if="${sent}"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>Bu adres kayıtlıysa parola sıfırlama bağlantısı gönderildi. Gelen kutunuzu kontrol edin.</p>
                <th:block th:unless="${sent}">
                    <p class="muted">E-posta adresinizi yazın, size yeni parola bağlantısı gönderelim.</p>
                    <form th:action="@{/forgot-password}" th:object="${form}" method="post" class="form" data-stagger>
                        <div class="field">
                            <label for="email">E-posta</label>
                            <input id="email" type="email" th:field="*{email}" autocomplete="email" required th:attr="aria-invalid=${#fields.hasErrors('email')}">
                            <p th:replace="~{fragments/forms :: error('email')}"></p>
                        </div>
                        <button class="btn btn-primary btn-block" type="submit">Bağlantı gönder</button>
                    </form>
                </th:block>
                <p class="auth-foot"><a th:href="@{/login}">Girişe dön</a></p>
            </div>
            <p class="folio" aria-hidden="true">13</p>
        </div>
    </section>
</main>
</body>
</html>
