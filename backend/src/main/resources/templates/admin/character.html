<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Karakteri düzenle · Yönetim')}"></head>
<body>
<svg th:replace="~{fragments/layout :: icons}"></svg>
<a th:replace="~{fragments/layout :: skip}"></a>
<div th:replace="~{fragments/admin :: adminNav('characters')}"></div>
<main id="main" class="narrow">
    <div th:replace="~{fragments/admin :: messages}"></div>
    <a class="btn btn-ghost btn-sm" th:href="@{/admin/characters}"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>Karakterler</a>
    <section class="card">
        <h1 th:text="${characterName} + ' karakterini düzenle'">Karakteri düzenle</h1>
        <p class="muted">Değişiklik bütün ebeveynlerde hemen görünür. Görünümü değiştirirseniz karakterin referans portresi bir sonraki resimde yeniden çizilir; eski masalların resimleri değişmez.</p>
        <form th:action="@{/admin/characters/{id}(id=${characterId})}" th:object="${form}" method="post" enctype="multipart/form-data" class="form" novalidate>
            <th:block th:replace="~{fragments/forms :: character-fields}"></th:block>
            <fieldset th:replace="~{fragments/forms :: sample-images(${existingImages}, ${!#lists.isEmpty(existingImages)})}"></fieldset>
            <button class="btn btn-primary" type="submit">Kaydet</button>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/admin-library.js}" defer></script>
</body>
</html>
