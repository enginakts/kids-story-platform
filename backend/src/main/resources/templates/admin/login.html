<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Yönetici girişi')}"></head>
<body>
<main class="page narrow">
    <h1>Yönetici girişi</h1>
    <p class="error" th:if="${param.error}">Bilgiler hatalı.</p>
    <p class="error" th:if="${param.locked}">Çok fazla hatalı deneme yapıldı. Lütfen 15 dakika sonra tekrar deneyin.</p>
    <form th:action="@{/admin/login}" method="post" class="form">
        <label>Kullanıcı adı veya e-posta <input name="username" autocomplete="username" required></label>
        <label>Parola <input type="password" name="password" autocomplete="current-password" required></label>
        <button class="button">Giriş yap</button>
    </form>
</main>
</body>
</html>
