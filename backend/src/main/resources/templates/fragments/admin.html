<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Yönetim panelinin gezinmesi: ebeveyn sayfalarıyla aynı yapı (fragments/layout.html appNav). Masaüstünde solda sabit kenar çubuğu,
     dar ekranda üst çubuk ve aşağı açılan menü paneli (nav.js).
     Karakterler ve Mekânlar bütün yöneticilere, Yapay zekâ ve Yöneticiler yalnızca süper yöneticiye görünür; yetki SecurityConfig'te de denetlenir. -->
<header th:fragment="adminNav(active)" class="app-shell" data-app-shell>
    <div class="shell-bar">
        <a class="shell-brand" th:href="@{/admin}" aria-label="Masal Dünyası yönetim">
            <svg class="apple" aria-hidden="true"><use href="#apple"/></svg><span>Yönetim</span>
        </a>
        <button class="shell-toggle" type="button" aria-expanded="false" aria-controls="app-menu" aria-label="Menüyü aç" data-menu-toggle>
            <svg class="icon icon-open" aria-hidden="true"><use href="#i-menu"/></svg><svg class="icon icon-close" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
    </div>
    <div class="shell-menu" id="app-menu">
        <nav class="shell-nav" aria-label="Yönetim menüsü">
            <ul>
                <li><a th:href="@{/admin}" th:attr="aria-current=${active == 'overview'} ? 'page' : null">
                    <svg class="icon" aria-hidden="true"><use href="#i-compass"/></svg><span>Genel bakış</span></a></li>
                <li><a th:href="@{/admin/stories}" th:attr="aria-current=${active == 'stories'} ? 'page' : null">
                    <svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><span>Masallar</span></a></li>
                <li><a th:href="@{/admin/parents}" th:attr="aria-current=${active == 'parents'} ? 'page' : null">
                    <svg class="icon" aria-hidden="true"><use href="#i-users"/></svg><span>Ebeveynler</span></a></li>
                <li><a th:href="@{/admin/characters}" th:attr="aria-current=${active == 'characters'} ? 'page' : null">
                    <svg class="icon" aria-hidden="true"><use href="#i-sparkles"/></svg><span>Karakterler</span></a></li>
                <li><a th:href="@{/admin/locations}" th:attr="aria-current=${active == 'locations'} ? 'page' : null">
                    <svg class="icon" aria-hidden="true"><use href="#i-map-pin"/></svg><span>Mekânlar</span></a></li>
                <li th:if="${superAdmin}"><a th:href="@{/admin/ai}" th:attr="aria-current=${active == 'ai'} ? 'page' : null">
                    <svg class="icon" aria-hidden="true"><use href="#i-sparkles"/></svg><span>Yapay zekâ</span></a></li>
                <li th:if="${superAdmin}"><a th:href="@{/admin/keys}" th:attr="aria-current=${active == 'keys'} ? 'page' : null">
                    <svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg><span>API anahtarları</span></a></li>
                <li th:if="${superAdmin}"><a th:href="@{/admin/usage}" th:attr="aria-current=${active == 'usage'} ? 'page' : null">
                    <svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg><span>Kullanım</span></a></li>
                <li th:if="${superAdmin}"><a th:href="@{/admin/admins}" th:attr="aria-current=${active == 'admins'} ? 'page' : null">
                    <svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg><span>Yöneticiler</span></a></li>
            </ul>
        </nav>
        <div class="shell-foot">
            <p class="shell-user"><svg class="apple" aria-hidden="true"><use href="#apple"/></svg>
                <span><span th:text="${user.displayName}">Yönetici</span><small th:text="${superAdmin} ? 'Süper yönetici' : 'Yönetici'">Yönetici</small></span></p>
            <form th:action="@{/admin/logout}" method="post">
                <button class="shell-logout" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg><span>Çıkış yap</span></button>
            </form>
        </div>
    </div>
</header>

<!-- Bildirim ve hata mesajları (yönlendirme sonrası) -->
<div th:fragment="messages" class="flash-area">
    <p class="alert alert-success" role="status" th:if="${notice}"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span th:text="${notice}">Kaydedildi.</span></p>
    <p class="alert alert-danger" role="alert" th:if="${problem}"><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg><span th:text="${problem}">Hata.</span></p>
</div>
</body>
</html>
