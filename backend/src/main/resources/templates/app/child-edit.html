<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Çocuk profilini düzenle')}"></head>
<body>
<header th:replace="~{fragments/layout :: appNav(${user.displayName})}"></header>
<main class="page">
    <a class="crumb" th:href="@{/app/children}">← Çocuklarım</a>
    <section class="panel" style="max-width:640px">
        <h1 style="font-size:var(--step-3);margin-bottom:20px">Profili düzenle</h1>
        <form th:action="@{/app/children/{id}(id=${childId})}" th:object="${form}" method="post" class="form">
            <th:block th:replace="~{fragments/child-fields :: fields}"></th:block>
            <button class="button">Kaydet</button>
        </form>
    </section>
</main>
</body>
</html>
