<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${detail.story.title})}"></head>
<body>
<svg th:replace="~{fragments/layout :: icons}"></svg>
<a th:replace="~{fragments/layout :: skip}"></a>
<header th:replace="~{fragments/layout :: appNav(${user.displayName}, 'library')}"></header>
<main id="main" class="story-page" th:with="s=${detail.story}">
    <a class="btn btn-ghost btn-sm" th:href="@{/app}"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>Kütüphanem</a>

    <th:block th:if="${s.status == 'PENDING' or s.status == 'GENERATING'}">
        <section class="card generating" role="status" aria-live="polite">
            <span class="spinner" aria-hidden="true"></span>
            <h1>Masalınız hazırlanıyor</h1>
            <p class="muted" th:text="${s.childName} + ' için ' + ${#strings.toLowerCase(s.theme)} + ' temalı bir masal yazılıyor. Bu sayfa kendiliğinden yenilenir.'">Yazılıyor.</p>
        </section>
        <script>setTimeout(function () { location.reload(); }, 3000);</script>
    </th:block>

    <section class="card" th:if="${s.status == 'FAILED'}" role="alert">
        <h1>Masal oluşturulamadı</h1>
        <p class="muted">Bir sorun nedeniyle masal hazırlanamadı. Harcanan kredi hesabınıza iade edildi.</p>
        <a class="btn btn-primary" th:href="@{/app/stories/new}">Yeniden dene</a>
    </section>

    <th:block th:if="${s.status == 'COMPLETED'}">
        <header class="story-head">
            <h1 th:text="${s.title}">Masal başlığı</h1>
            <ul class="chips">
                <li class="chip chip-primary" th:text="${s.childName} + ' için'">Ada için</li>
                <li class="chip" th:text="${s.theme}">Paylaşma</li>
                <li class="chip" th:text="${detail.narrationStyle}">Sıcak</li>
            </ul>
        </header>
        <ol class="scenes">
            <li class="scene card" th:each="scene : ${detail.scenes}">
                <div class="scene-art" aria-hidden="true">
                    <svg class="icon icon-lg"><use href="#i-image"/></svg>
                    <span>Görsel bir sonraki adımda eklenecek</span>
                </div>
                <p class="scene-text" th:text="${scene.text}">Sahne metni</p>
                <span class="scene-number" th:text="${scene.sceneNumber} + ' / ' + ${#lists.size(detail.scenes)}">1 / 5</span>
            </li>
        </ol>
    </th:block>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
