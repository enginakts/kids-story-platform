app.jwt.secret=test-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
app.bootstrap.admin.username=testadmin
app.bootstrap.admin.email=testadmin@example.com
app.bootstrap.admin.password=TestAdmin123!
# Tüm testler aynı IP'den geldiği için IP sınırı testlerde yükseltilir (sınır birim testte doğrulanır).
app.security.ip-requests-per-minute=100000
app.media.dir=${java.io.tmpdir}/kidstory-test-media
# Testler hiçbir gerçek sağlayıcıya gitmez: backend/.env içindeki anahtarlar testlerde boşaltılır.
app.ai.featherless.api-key=
app.ai.gemini.api-key=
app.ai.groq.api-key=
app.ai.cloudflare.account-id=
app.ai.cloudflare.api-token=
app.ai.azure-speech.key=
app.ai.murf.api-key=

# Geçici masal temizliği testlerde zamanlanmış çalışmaz; testler UnsavedStoryCleaner.runOnce() çağırır
app.stories.cleanup-enabled=false
