# Yerel geliştirme gizli ayarları (ÖRNEK).
# Bu dosyayı backend/config/application-dev.properties olarak kopyalayın ve doldurun.
# backend/config/ klasörü .gitignore'dadır; gerçek parola ve anahtarlar asla commit edilmez.
# Uygulama backend klasöründen çalıştırıldığında Spring Boot bu dosyayı kendiliğinden okur.

# ---------- E-posta (SMTP) ----------
# Seçenek A: Gmail (kişisel denemeler için; günlük gönderim sınırı vardır)
#   1) Google hesabında 2 adımlı doğrulamayı açın.
#   2) https://myaccount.google.com/apppasswords adresinden bir "Uygulama şifresi" oluşturun (16 karakter).
#   3) Normal Gmail parolanızı DEĞİL, bu uygulama şifresini aşağıya yazın.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=adresiniz@gmail.com
spring.mail.password=uygulama-sifresi-16-karakter
app.mail.from=Masal Dünyası <adresiniz@gmail.com>

# Seçenek B: Brevo (işlemsel e-posta servisi; ücretsiz katmanı vardır, ticari kullanıma daha uygun)
#   Brevo panelinde SMTP & API > SMTP sekmesinden kullanıcı adı ve SMTP anahtarını alın,
#   gönderen adresini Brevo'da doğrulayın.
#spring.mail.host=smtp-relay.brevo.com
#spring.mail.port=587
#spring.mail.username=brevo-smtp-kullanici-adi
#spring.mail.password=brevo-smtp-anahtari
